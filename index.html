
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sayonara 2K25 Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: black;
    }
    #map {
      height: 100%;
      width: 100%;
      position: absolute;
    }
    .leaflet-popup-content {
      font-weight: 900;
      font-size: 24px;
      color: black;
    }
    .label {
      font-size: 5vw;
      font-weight: 1000;
      color: black;
      text-shadow: 2px 2px 4px white;
    }
    #confetti-canvas {
      position: fixed;
      pointer-events: none;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 9999;
    }
  </style>
</head>
<body>

<canvas id="confetti-canvas"></canvas>
<div id="map"></div>
<audio autoplay loop>
  <source src="audio.mp3" type="audio/mpeg">
  Your browser does not support the audio element.
</audio>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
<script>
  const map = L.map('map').setView([11.2150, 78.1670], 13); // Namakkal coordinates

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  function updateLabel(zoom) {
    let label = "";
    if (zoom < 13) label = "VCEW";
    else if (zoom < 15) label = "BME";
    else if (zoom < 17) label = "Sayonara 2K25";
    else if (zoom < 19) label = "VCTW - 12/04/2025";
    else label = "See You There Our Queens!";

    if (window.labelLayer) map.removeLayer(window.labelLayer);
    window.labelLayer = L.marker(map.getCenter(), {
      icon: L.divIcon({
        className: 'label',
        html: `<div class="label">${label}</div>`,
        iconSize: [300, 100]
      })
    }).addTo(map);
  }

  map.on('zoomend', () => {
    updateLabel(map.getZoom());
    confetti({
      particleCount: 100,
      spread: 70,
      origin: { y: 0.6 }
    });
  });

  updateLabel(map.getZoom());
</script>

</body>
</html>
